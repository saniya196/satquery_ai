services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SATQUERY_DB: ${SATQUERY_DB:-/app/.data/satquery.db}
      SATQUERY_MODEL_DIR: /app/models
      SATQUERY_CORS_ORIGINS: ${SATQUERY_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    volumes:
      - satquery-db:/app/.data
      - satellite-cache:/app/.cache/satquery
      - ./models:/app/models:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  satquery-db:
  satellite-cache: